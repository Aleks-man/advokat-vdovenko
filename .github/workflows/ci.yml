name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run typecheck

      - name: Run API tests
        run: npm test

      - name: Build workspaces
        run: npm run build

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Run browser tests
        run: npm run test:browser

      - name: Upload browser failure report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
            artifacts/
          retention-days: 7
          if-no-files-found: ignore
